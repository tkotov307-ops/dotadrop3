    async function openCase(){
      if(!state.user){state.modal="auth";state.authMode="login";render();return toast("Войдите, чтобы открыть кейс");}
      if(!state.moneydropSchema)return toast("База Supabase использует старую версию. Выполните актуальный supabase.sql, чтобы включить кейсы MoneyDrop.");
      var c=getCase(state.caseId),price=c.category==="risk"?riskPrice():c.price;
      if(Number(state.balance)<price*state.quantity){
        return toast("Недостаточно средств. Пополните баланс или выберите дешевый кейс.");
      }
      state.rolling=true;render();
      try{
        var r=await rpc("open_case",{p_case_id:c.id,p_quantity:state.quantity,p_risk_level:state.risk});
        state.balance=Number(r.balance)||state.balance;
        state.winnings=(r.drops||[]).map(function(d){return {id:d.id,name:d.name,value:Number(d.price),kind:d.kind||"cash",rarity:d.rarity};});
        state.winningsIds=r.inventory_ids||[];
        var reel=[];
        for(var i=0;i<26;i++){reel.push(ITEMS[(Math.floor(Math.random()*ITEMS.length))]);}
        reel[13]=state.winnings[0]||ITEMS[0];state.reel=reel;
        state.rolling=false;render();
        var track=document.getElementById("roulette-track"),viewport=document.querySelector(".roulette-window");
        if(track&&viewport){track.style.transition="transform 2.4s cubic-bezier(.12,.75,.12,1)";track.style.transform="translateX(-"+(Math.max(0,13*146-viewport.clientWidth/2))+"px)";}
        playWin();
        setTimeout(function(){state.modal="win";render();refreshProfile();refreshPublic();},2500);
      }catch(e){state.rolling=false;render();toast(e.message||"Не удалось открыть кейс");}
    }
    async function claim(sell){
      if(!state.winnings)return;
      try{
        if(sell)await rpc("sell_inventory",{p_inventory_ids:state.winningsIds});
        await refreshProfile();
        state.modal=null;state.winnings=null;state.winningsIds=[];render();toast(sell?"Выигрыш зачтен на баланс":"Приз оставлен в сейфе");
      }catch(e){toast(e.message||"Ошибка операции");}
    }
    async function createDeposit(){
      if(!state.user){state.modal="auth";state.authMode="login";render();return;}
      var custom=Number(document.getElementById("cash-custom")&&document.getElementById("cash-custom").value||state.amount);
      state.amount=Math.max(100,custom);state.promo=document.getElementById("cash-promo")&&document.getElementById("cash-promo").value||state.promo;
      if(state.method==="demo"){
        try{var dr=await rpc("create_deposit",{p_amount:state.amount,p_method:"demo",p_promo_code:state.promo});state.modal=null;render();toast("Демо-заявка создана: "+dr.status);}catch(e){toast(e.message);}
        return;
      }
      state.cashStep="payment";render();
    }
    async function paidDeposit(){
      try{var r=await rpc("create_deposit",{p_amount:state.amount,p_method:state.method,p_promo_code:state.promo});state.modal=null;state.cashStep="method";render();toast("Заявка создана, статус: "+r.status);}
      catch(e){toast(e.message||"Не удалось создать заявку");}
    }
    async function createWithdraw(){
      var address=document.getElementById("withdraw-address"),amount=document.getElementById("withdraw-amount");
      state.withdrawAddress=address?address.value.trim():state.withdrawAddress;state.withdrawAmount=amount?Number(amount.value):state.withdrawAmount;
      if(!state.withdrawAddress)return toast("Укажите реквизиты");
      try{var r=await rpc("create_withdraw",{p_amount:state.withdrawAmount,p_method:state.withdrawMethod,p_details:state.withdrawAddress});state.modal=null;await refreshProfile();render();toast("Заявка на вывод создана");}
      catch(e){toast(e.message||"Не удалось создать заявку");}
    }
    async function authSubmit(form){
      var fd=new FormData(form),email=fd.get("email").trim().toLowerCase(),password=fd.get("password");
      try{
        if(state.authMode==="signup"){var sr=await db.auth.signUp({email:email,password:password,options:{data:{username:fd.get("username")}}});if(sr.error)throw sr.error;}
        else{var lr=await db.auth.signInWithPassword({email:email,password:password});if(lr.error)throw lr.error;state.session=lr.data.session;state.user=lr.data.user;}
        if(!state.session&&db.auth){var gr=await db.auth.getSession();state.session=gr.data.session;state.user=state.session&&state.session.user;}
        state.modal=null;await refreshProfile();await refreshPublic();render();toast("Аккаунт готов");
      }catch(e){toast(e.message||"Ошибка авторизации");}
    }
    async function signOut(){await db.auth.signOut();state.user=null;state.session=null;state.profile=null;state.role="user";state.balance=0;state.inventory=[];render();}

    function audioCtx(){if(!state.audio){var C=window.AudioContext||window.webkitAudioContext;if(C)state.audio=new C();}return state.audio;}
    function tone(freq,dur){if(!state.sound)return;try{var c=audioCtx();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){}}
    function playWin(){
      [523,659,784,1047].forEach(function(f,i){
        setTimeout(function(){tone(f,.18);},i*120);
      });
    }

    document.addEventListener("click",function(e){
      var b=e.target.closest("[data-action]");if(!b)return;
      var a=b.dataset.action;
      if(a==="nav"){state.page=b.dataset.page;state.caseId=null;state.menu=false;if(state.page==="admin")loadAdmin();render();}
      else if(a==="menu"){state.menu=!state.menu;render();}
      else if(a==="cash"){state.modal="cash";state.cashTab="deposit";state.cashStep="method";render();}
      else if(a==="withdraw"){if(!state.user){state.modal="auth";state.authMode="login";render();}else{state.modal="withdraw";state.cashTab="withdraw";render();}}
      else if(a==="modal-close"){state.modal=null;state.cashStep="method";render();}
      else if(a==="cash-tab"){state.cashTab=b.dataset.tab;state.modal=state.cashTab==="withdraw"?"withdraw":"cash";render();}
      else if(a==="pay-method"){state.method=b.dataset.method;render();}
      else if(a==="withdraw-method"){state.withdrawMethod=b.dataset.method;render();}
      else if(a==="amount"){state.amount=Number(b.dataset.amount);render();}
      else if(a==="cash-pay")createDeposit();
      else if(a==="cash-back"){state.cashStep="method";render();}
      else if(a==="cash-paid")paidDeposit();
      else if(a==="withdraw-create")createWithdraw();
      else if(a==="open-case"){state.caseId=b.dataset.id;render();}
      else if(a==="back"){state.caseId=null;render();}
      else if(a==="risk"){state.risk=b.dataset.risk;if(state.caseId)render();else render();}
      else if(a==="quantity"){state.quantity=Number(b.dataset.value);render();}
      else if(a==="open")openCase();
      else if(a==="keep")claim(false);
      else if(a==="claim")claim(true);
      else if(a==="sell-item")rpc("sell_inventory",{p_inventory_ids:[b.dataset.uid]}).then(function(){return refreshProfile();}).then(function(){render();toast("Приз зачтен на баланс");}).catch(function(x){toast(x.message);});
      else if(a==="sell-all"){var ids=state.inventory.map(function(i){return i.uid||i.id;});rpc("sell_inventory",{p_inventory_ids:ids}).then(function(){return refreshProfile();}).then(function(){render();toast("Сейф зачтен на баланс");}).catch(function(x){toast(x.message);});}
      else if(a==="scroll-cases"){document.getElementById("catalog").scrollIntoView({behavior:"smooth"});}
      else if(a==="logout")signOut();
      else if(a==="auth-open"){state.modal="auth";state.authMode=b.dataset.mode||"login";render();}
      else if(a==="auth-switch"){state.authMode=state.authMode==="signup"?"login":"signup";render();}
      else if(a==="upgrade"){
        var source=document.getElementById("upgrade-source").value,target=document.getElementById("upgrade-target").value;
        if(!source)return toast("Выберите предмет в сейфе");
        rpc("upgrade_item",{p_inventory_id:source,p_target_skin_id:target,p_use_balance:false,p_stake:0}).then(function(r){return refreshProfile().then(function(){render();toast(r.success?"Апгрейд успешен":"Апгрейд неуспешен");});}).catch(function(x){toast(x.message);});
      }
      else if(a==="admin-tab"){state.adminTab=b.dataset.tab;render();}
      else if(a==="tx-filter"){state.txFilter=b.dataset.filter;render();}
      else if(a==="tx-approve"){rpc("admin_approve_deposit",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="tx-reject"){rpc("admin_reject_transaction",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="tx-complete"){rpc("admin_complete_withdraw",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="tx-refund"){rpc("admin_refund_withdraw",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="admin-balance"){var id=b.dataset.id,input=document.querySelector('[data-balance-user="'+id+'"]');rpc("admin_set_balance",{p_user_id:id,p_balance:Number(input.value)}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="admin-save-settings"){rpc("admin_save_settings",{p_rtp:Number(document.getElementById("setting-rtp").value)/100,p_streamer_mode:document.getElementById("setting-streamer").checked,p_banner_title:"MoneyDrop",p_live_drop_speed:5,p_card_requisite:document.getElementById("setting-card").value,p_sbp_requisite:document.getElementById("setting-sbp").value,p_usdt_requisite:document.getElementById("setting-usdt").value,p_demo_deposit:document.getElementById("setting-demo").checked}).then(refreshPublic).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="admin-save-promo"){rpc("admin_save_promocode",{p_code:document.getElementById("promo-code").value,p_reward:Number(document.getElementById("promo-reward").value),p_activations:Number(document.getElementById("promo-limit").value)}).then(function(){toast("Промокод сохранен");}).catch(function(x){toast(x.message);});}
    });
    document.addEventListener("submit",function(e){if(e.target.dataset.form==="auth"){e.preventDefault();authSubmit(e.target);}});

    async function init(){
      render();
      try{
        var session=await db.auth.getSession();state.session=session.data.session;state.user=state.session&&state.session.user;
        await refreshPublic();
        await refreshProfile();
        if(state.user&&state.role==="admin")await loadAdmin();
      }catch(e){console.error(e);}
      render();
    }
    if(db)init();else{render();toast("Supabase JS не загрузился");}
  </script>
</body>
</html>
