    function loadSaved() {
      try {
        var saved = window.localStorage.getItem(SAVE_KEY);
        if (!saved) return;
        var data = JSON.parse(saved);
        if (data && typeof data==="object") {
          if (typeof data.balance==="number" && isFinite(data.balance)) state.balance=Math.max(0,data.balance);
          if (Array.isArray(data.inventory)) state.inventory=data.inventory.filter(function(entry){return entry&&typeof entry.uid==="string"&&ITEMS.some(function(item){return item.id===entry.itemId;});});
          if (typeof data.nickname==="string"&&data.nickname.trim()) state.nickname=data.nickname.slice(0,18);
          if (typeof data.opened==="number") state.opened=Math.max(0,data.opened);
          if (typeof data.bestDrop==="number") state.bestDrop=Math.max(0,data.bestDrop);
          if (typeof data.profit==="number") state.profit=data.profit;
        }
      } catch (error) {
        state.storageError="Не удалось прочитать локальное сохранение.";
      }
    }

      }).join("");
      var value=chosen.reduce(function(sum,entry){return sum+getItem(entry.itemId).price;},0);
      return '<div class="wrap main"><div class="page-title"><div><span class="eyebrow">⚔ TRADE UP</span><h1>Контракты <span>обмена</span></h1><p>Объедини три предмета и получи один новый.</p></div></div><section class="contract-panel"><div class="contract-copy"><span class="contract-icon">⚔</span><span class="eyebrow">TRADE-UP CONTRACT</span><h2>Три предмета.<br><span>Один новый шанс.</span></h2><p>Три первых предмета инвентаря обмениваются на один новый. Их стоимость определяет диапазон дропа.</p><div class="contract-stat"><span>Предметов в инвентаре</span><b>'+state.inventory.length+' / 3</b></div><div class="contract-stat"><span>Стоимость обмена</span><b>'+money(value)+'</b></div><button class="primary" data-action="craft">⚔ Создать контракт　➜</button>'+(state.contractNotice?'<div class="notice">'+escapeHtml(state.contractNotice)+'</div>':'')+'</div><div class="contract-slots">'+slots+'<div class="result-slot">✦<b>?</b><span>НОВЫЙ ПРЕДМЕТ</span></div></div></section><p class="help-text">ⓘ Контракт использует первые три предмета инвентаря. После обмена вернуть предметы нельзя.</p></div>';
    }
    function renderBonuses() {
      return '<div class="wrap main"><div class="page-title"><div><span class="eyebrow">✦ DAILY REWARDS</span><h1>Бонусы <span>и награды</span></h1><p>Забирай виртуальные бонусы и открывай больше кейсов.</p></div></div><section class="bonus-hero"><div class="gift-art">♙</div><div><span class="eyebrow">WELCOME BONUS</span><h2>Больше дропа.<br><span>Больше поводов зайти.</span></h2><p>Добавь демо-монеты на баланс.<br>Никаких платежей — только игра.</p><button class="primary" data-action="bonus">＋ Забрать +500 ₽</button></div><strong class="bonus-amount">+500 ₽</strong></section><div class="bonus-grid"><article class="bonus-card"><span class="eyebrow">✦ КАЖДЫЙ ДЕНЬ</span><h3>Демо-подарок</h3><p>Попробуй кейсы с дополнительным балансом.</p><button data-action="bonus">Забрать +500 ₽　➜</button></article><article class="bonus-card"><span class="eyebrow">ϟ БЕЗ ОГРАНИЧЕНИЙ</span><h3>Тестируй механику</h3><p>Демо-пополнение всегда доступно в шапке сайта.</p><button data-action="bonus">Пополнить　➜</button></article><article class="bonus-card"><span class="eyebrow">◇ ЧЕСТНЫЕ ПРАВИЛА</span><h3>Без реальных денег</h3><p>Баланс существует только в браузере и не имеет стоимости.</p><button data-action="help">Как это работает　➜</button></article></div></div>';
    }
    function renderProfile() {
      var filters=["Все предметы","Arcana","Immortal","Остальные"];
      var selected=state.inventory.filter(function(entry){
        var rarity=getItem(entry.itemId).rarity;
        return state.filter==="Все предметы"||(state.filter==="Arcana"&&rarity==="arcana")||(state.filter==="Immortal"&&rarity==="immortal")||(state.filter==="Остальные"&&rarity!=="arcana"&&rarity!=="immortal");
      });
      var owned=selected.map(function(entry){
        var item=getItem(entry.itemId);
        return '<article class="owned '+item.rarity+'">'+itemArt(item)+'<span class="item-rarity">'+RARITY_LABEL[item.rarity]+'</span><b class="item-name">'+escapeHtml(item.name)+'</b><span class="item-hero">'+escapeHtml(item.hero)+'</span><strong class="item-value">'+money(item.price)+'</strong><button data-action="sell-item" data-uid="'+escapeHtml(entry.uid)+'">◉ Продать</button></article>';
      }).join("");
      return '<div class="wrap main"><section class="profile-head"><div class="profile-user"><span class="profile-avatar">'+escapeHtml(state.nickname.charAt(0).toUpperCase())+'</span><div><span class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</span><h1>'+escapeHtml(state.nickname)+'</h1><span class="profile-sub">◇ Участник NEONDROP</span></div></div><button class="demo-button profile-add" data-action="profile-bonus">＋ Пополнить демо-баланс <strong>+5000 ₽</strong></button></section><div class="profile-stats"><div class="profile-stat"><i>▧</i><small>ОТКРЫТО КЕЙСОВ</small><b>'+state.opened+'</b></div><div class="profile-stat"><i class="gold">♛</i><small>ЛУЧШИЙ ДРОП</small><b>'+money(state.bestDrop)+'</b></div><div class="profile-stat"><i class="'+(state.profit>=0?"green":"red")+'">◉</i><small>ОБЩИЙ ПРОФИТ</small><b class="'+(state.profit>=0?"green":"red")+'">'+money(state.profit)+'</b></div><div class="profile-stat"><i>▣</i><small>ИНВЕНТАРЬ</small><b>'+money(inventoryValue())+'</b></div></div><section class="profile-card"><span class="eyebrow">♙ ПРОФИЛЬ</span><h2>Настройки аккаунта</h2><div class="nickname"><input data-action="nickname" aria-label="Никнейм" maxlength="18" value="'+escapeHtml(state.nickname)+'"><button data-action="save-name">Сохранить</button></div>'+(state.storageError?'<small class="help-text">'+escapeHtml(state.storageError)+'</small>':'')+'</section><section>'+sectionHeading("▧ YOUR COLLECTION","Инвентарь <span>("+state.inventory.length+")</span>",state.inventory.length?'<button class="sell-all" data-action="sell-all">◉ Продать всё за '+money(inventoryValue())+'</button>':'')+'<div class="inventory-toolbar"><div class="filters">'+filters.map(function(filter){return '<button data-action="filter" data-filter="'+filter+'" class="'+(state.filter===filter?"selected":"")+'">'+filter+'</button>';}).join("")+'</div><span class="help-text">◷ Новые сначала</span></div>'+(owned?'<div class="items-grid">'+owned+'</div>':'<div class="empty-inventory"><b>'+(state.inventory.length?"В этой категории пока пусто":"Инвентарь пока пуст")+'</b><span>Открой кейс и забери свой первый дроп.</span></div>')+'</section></div>';
    }
    function render() {
      var content=state.caseId?renderCase():state.page==="cases"?renderCases():state.page==="upgrade"?renderUpgrade():state.page==="contracts"?renderContracts():state.page==="bonuses"?renderBonuses():renderProfile();
      root.innerHTML='<div class="shell">'+header()+'<section class="wrap live"><span class="live-label"><i></i> LIVE DROP</span><div class="live-list" id="live-list">'+state.live.map(liveCard).join("")+'</div><button class="arrow" data-action="catalog" aria-label="Каталог">➜</button></section><main>'+content+'</main>'+footer()+(state.toast?'<div class="toast">'+escapeHtml(state.toast)+'</div>':'')+'</div>';
      updateCountdown();
    }
    function updateCountdown() {
      var countdown=document.getElementById("countdown");
      if(!countdown)return;
      var now=Date.now();
      if(!state.eventDeadline)state.eventDeadline=now+23*24*60*60*1000;
      var remaining=Math.max(0,Math.floor((state.eventDeadline-now)/1000));
      var days=Math.floor(remaining/86400),hours=Math.floor((remaining%86400)/3600),minutes=Math.floor((remaining%3600)/60),seconds=remaining%60;
      function pad(value){return value<10?"0"+value:String(value);}
      countdown.textContent=days+" ДН. "+pad(hours)+":"+pad(minutes)+":"+pad(seconds);
    }
    function weightedDrop(itemCase) {
      var pool=itemCase.items.map(getItem),total=0,weights=[];
      for(var i=0;i<pool.length;i++){weights[i]=12000/pool[i].price;total+=weights[i];}
      var random=Math.random()*total;
      for(var j=0;j<pool.length;j++){random-=weights[j];if(random<=0)return pool[j];}
      return pool[pool.length-1];
    }
    function startOpen() {
      if(state.rolling||!state.caseId)return;
      var current=getCase(state.caseId),price=current.id==="risk"?RISK_PRICES[state.risk]:current.price,total=price*state.quantity;
      if(state.balance<total){setToast("Недостаточно средств — пополните демо-баланс");return;}
      state.balance-=total;state.opened+=state.quantity;state.profit-=total;save();
      state.winnings=[];
      for(var i=0;i<state.quantity;i++)state.winnings.push(weightedDrop(current));
      state.reel=[];
      for(var j=0;j<30;j++)state.reel.push(getItem(current.items[Math.floor(Math.random()*current.items.length)]));
      state.reel[10]=state.winnings[0];
      state.rolling=true;
      render();
      window.setTimeout(function(){state.rolling=false;save();render();},state.fast?300:2500);
    }
    function finishWinnings(sell) {
      if(!state.winnings)return;
      var amount=state.winnings.reduce(function(sum,item){return sum+item.price;},0);
      state.bestDrop=Math.max.apply(Math,[state.bestDrop].concat(state.winnings.map(function(item){return item.price;})));
      state.profit+=amount;
      if(sell)state.balance+=amount;
      else for(var i=0;i<state.winnings.length;i++)state.inventory.unshift({uid:String(Date.now())+"-"+Math.random().toString(36).slice(2),itemId:state.winnings[i].id,obtainedAt:Date.now()});
      state.winnings=null;save();render();
      setToast(sell?"Продано за "+money(amount):"Предмет добавлен в инвентарь");
    }
    function runUpgrade() {
      var chance=upgradeChance(),target=currentTarget(),value=sourcePrice(),source=state.inventory.filter(function(entry){return entry.uid===state.sourceUid;})[0];
      if(!chance||state.rolling)return;
      if(state.upgradeMode==="item"&&!source){setToast("Сначала выберите предмет");return;}
      if(state.upgradeMode==="balance"&&(value>state.balance||value<1)){setToast("Проверьте сумму ставки");return;}
      var success=Math.random()*100<chance;
      state.rolling=true;render();
      window.setTimeout(function(){
        if(state.upgradeMode==="balance")state.balance-=value;
        else state.inventory=state.inventory.filter(function(entry){return entry.uid!==state.sourceUid;});
        state.profit-=value;
        if(success){
          state.inventory.unshift({uid:String(Date.now())+"-"+Math.random().toString(36).slice(2),itemId:target.id,obtainedAt:Date.now()});
          state.bestDrop=Math.max(state.bestDrop,target.price);state.profit+=target.price;state.sourceUid=null;
        }
        state.rolling=false;save();render();
        setToast(success?"Апгрейд успешен: "+target.name:"Не повезло — ставка сгорела");
      },1000);
    }
    function runContract() {
      if(state.inventory.length<3){state.contractNotice="Для контракта нужно минимум 3 предмета в инвентаре.";render();return;}
      var used=state.inventory.slice(0,3),value=used.reduce(function(sum,entry){return sum+getItem(entry.itemId).price;},0);
      var pool=ITEMS.filter(function(item){return item.price>value*.8&&item.price<=value*1.8;});
      var reward=pool.length?pool[Math.floor(Math.random()*pool.length)]:getItem("staff");
      state.inventory=state.inventory.slice(3);
      state.inventory.unshift({uid:String(Date.now())+"-"+Math.random().toString(36).slice(2),itemId:reward.id,obtainedAt:Date.now()});
      state.bestDrop=Math.max(state.bestDrop,reward.price);state.profit+=reward.price-value;
      state.contractNotice="Контракт готов! Получен "+reward.name;save();render();
    }
    function sellItem(uid) {
      var entry=state.inventory.filter(function(item){return item.uid===uid;})[0];
      if(!entry)return;
      state.balance+=getItem(entry.itemId).price;
      state.inventory=state.inventory.filter(function(item){return item.uid!==uid;});
      save();render();setToast("Предмет продан");
    }
    function sellAll() {
      if(!state.inventory.length)return;
      state.balance+=inventoryValue();state.inventory=[];save();render();setToast("Инвентарь продан");
    }
    function navigate(page) {
      if(state.rolling&&state.caseId){setToast("Дождитесь результата открытия кейса");return;}
      state.page=page;state.caseId=null;state.winnings=null;
      var nav=document.getElementById("main-nav");if(nav)nav.classList.remove("open");
      render();
    }
    function closestAction(node) {
      while(node&&node!==document) {
        if(node.getAttribute&&node.getAttribute("data-action"))return node;
        node=node.parentNode;
      }
      return null;
    }
    document.addEventListener("click",function(event){
      var button=closestAction(event.target);
      if(!button)return;
      var action=button.getAttribute("data-action");
      if(action==="home"||action==="catalog")navigate("cases");
      else if(action==="nav")navigate(button.getAttribute("data-page"));
      else if(action==="profile")navigate("profile");
      else if(action==="menu"){var nav=document.getElementById("main-nav");if(nav)nav.classList.toggle("open");}
      else if(action==="demo")addBalance(1000);
      else if(action==="profile-bonus")addBalance(5000);
      else if(action==="bonus")addBalance(500);
      else if(action==="help")setToast("Баланс и предметы — демонстрационные и хранятся только в этом браузере.");
      else if(action==="scroll-cases"){var catalog=document.getElementById("catalog");if(catalog)catalog.scrollIntoView({behavior:"smooth"});}
      else if(action==="open-case"){state.caseId=button.getAttribute("data-id");state.page="cases";state.quantity=1;state.winnings=null;render();}
      else if(action==="back"){if(state.rolling){setToast("Дождитесь результата открытия кейса");return;}state.caseId=null;state.winnings=null;render();}
      else if(action==="risk"){if(state.rolling)return;state.risk=button.getAttribute("data-risk");render();}
      else if(action==="quantity"){if(state.rolling)return;state.quantity=Number(button.getAttribute("data-value"))||1;render();}
      else if(action==="fast"){if(state.rolling)return;state.fast=!state.fast;render();}
      else if(action==="open")startOpen();
      else if(action==="claim")finishWinnings(false);
      else if(action==="sell-winnings")finishWinnings(true);
      else if(action==="sell-item")sellItem(button.getAttribute("data-uid"));
      else if(action==="sell-all")sellAll();
      else if(action==="upgrade-mode"){state.upgradeMode=button.getAttribute("data-mode");render();}
      else if(action==="source"){
        state.sourceUid=button.getAttribute("data-uid");
        var candidates=targetCandidates();
        if(candidates.length&&!candidates.some(function(item){return item.id===state.targetId;}))state.targetId=candidates[0].id;
        render();
      }
      else if(action==="target-button"){state.targetId=button.getAttribute("data-id");render();}
      else if(action==="upgrade")runUpgrade();
      else if(action==="craft")runContract();
      else if(action==="filter"){state.filter=button.getAttribute("data-filter");render();}
      else if(action==="save-name"){
        var input=document.querySelector('[data-action="nickname"]'),name=input?input.value.trim().slice(0,18):"";
        if(!name){setToast("Никнейм не может быть пустым");return;}
        state.nickname=name;save();render();setToast("Никнейм обновлён");
      }
    });
    document.addEventListener("change",function(event){
      var target=event.target;
      if(!target||!target.getAttribute)return;
      var action=target.getAttribute("data-action");
      if(action==="target"){state.targetId=target.value;render();}
      if(action==="stake"||action==="stake-range"){
        var enteredStake=Math.max(0,Number(target.value)||0);
        state.stake=state.upgradeMode==="balance"?Math.min(enteredStake,state.balance):enteredStake;
        var valid=targetCandidates();
        if(valid.length&&!valid.some(function(item){return item.id===state.targetId;}))state.targetId=valid[0].id;
        render();
      }
    });
    document.addEventListener("input",function(event){
      var target=event.target;
      if(!target||!target.getAttribute)return;
      var action=target.getAttribute("data-action");
      if(action==="stake"||action==="stake-range"){
        var enteredStake=Math.max(0,Number(target.value)||0);
        state.stake=state.upgradeMode==="balance"?Math.min(enteredStake,state.balance):enteredStake;
        var value=document.querySelector('[data-action="stake"]'),range=document.querySelector('[data-action="stake-range"]');
        var selected=document.querySelector(".selected-value b");
        if(value&&Number(value.value)!==state.stake)value.value=String(state.stake);
        if(range&&target!==range)range.value=String(Math.min(Math.max(1,state.stake),Math.max(1,state.balance)));
        if(selected)selected.textContent=money(state.stake);
        var chance=document.querySelector(".chance"),chanceLabel=document.querySelector(".chance>div>b"),hint=document.querySelector(".chance-hint");
        if(chance&&chanceLabel){
          var candidate=targetCandidates();
          if(candidate.length&&!candidate.some(function(item){return item.id===state.targetId;}))state.targetId=candidate[0].id;
          var current=currentTarget(),chanceValue=state.stake>0&&current.price>state.stake?Math.max(1,Math.min(75,Math.floor(state.stake/current.price*75))):0;
          chance.style.setProperty("--angle",(chanceValue*3.6)+"deg");chanceLabel.innerHTML=chanceValue+'<i>%</i>';
          if(hint)hint.textContent="Успех: "+chanceValue+"%　·　Сгорание: "+(chanceValue?100-chanceValue:0)+"%";
          var preview=document.querySelector(".target-preview");
          if(preview&&candidate.length){
            var safeItem=current;
            preview.className="target-preview "+safeItem.rarity;
            preview.innerHTML=itemArt(safeItem)+'<span>'+RARITY_LABEL[safeItem.rarity]+'</span><b>'+escapeHtml(safeItem.name)+'</b><small>'+escapeHtml(safeItem.hero)+'</small><strong>'+money(safeItem.price)+'</strong>';
            var select=document.querySelector('[data-action="target"]');
            if(select){select.innerHTML=candidate.map(function(item){return '<option value="'+item.id+'" '+(item.id===safeItem.id?"selected":"")+'>'+escapeHtml(item.name)+' — '+money(item.price)+'</option>';}).join("");}
            var quick=document.querySelector(".quick-targets");
            if(quick)quick.innerHTML=candidate.slice(0,4).map(function(item){return '<button data-action="target-button" data-id="'+item.id+'" class="'+(item.id===safeItem.id?"selected":"")+'">'+escapeHtml(item.icon)+'<small>'+money(item.price)+'</small></button>';}).join("");
          }
        }
      }
    });
    loadSaved();initDrops();render();
    window.setInterval(updateLive,4200);
    window.setInterval(updateCountdown,1000);
  })();
  </script>
</body>
</html>
