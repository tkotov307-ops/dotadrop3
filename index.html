    function updateCountdown() {

      var days=Math.floor(remaining/86400),hours=Math.floor((remaining%86400)/3600),minutes=Math.floor((remaining%3600)/60),seconds=remaining%60;
      function pad(value){return value<10?"0"+value:String(value);}

    function startOpen() {

        state.reel=[];

        state.reel[10]=state.winnings[0];
        state.rouletteOffset=0;

    function animateRoulette() {
      var track=document.querySelector(".roulette-track"),viewport=document.querySelector(".roulette-window");
      if(!track||!viewport||!track.children.length){
        state.rolling=false;render();playWinSound(state.winnings||[]);return;
      }
      var cards=Array.prototype.map.call(track.children,function(card){
        var rect=card.getBoundingClientRect();
        return rect.left+rect.width/2;
      });
      var winningIndex=Math.min(10,cards.length-1),pointer=viewport.getBoundingClientRect();
      var pointerCenter=pointer.left+pointer.width/2,distance=Math.max(0,cards[winningIndex]-pointerCenter);
      var nearest=function(offset){
        var result=0,delta=Infinity;
        for(var i=0;i<cards.length;i++){
          var current=Math.abs(cards[i]-offset-pointerCenter);
          if(current<delta){delta=current;result=i;}
        }
        return result;
      };
      var previous=nearest(0),start=0;
      var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var duration=reduced?400:(state.fast?620:2750);
      function frame(now) {
        if(!start)start=now;
        var progress=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-progress,4),offset=distance*eased;
        track.style.transform="translate3d("+(-offset)+"px,0,0)";
        var current=nearest(offset);
        if(current>previous){
          for(var index=previous+1;index<=current;index++)playRouletteTick(progress);
          previous=current;
        }
        if(progress<1){window.requestAnimationFrame(frame);return;}
        state.rouletteOffset=Math.round(distance);
        state.rolling=false;
        render();
        playWinSound(state.winnings||[]);
      }
      window.requestAnimationFrame(frame);
    }

      return operation.then(function(result){

        return refreshProfile();
      }).then(function(){

      });

        if(window.confirm("Удалить этот кейс?"))task(rpc("admin_delete_case",{p_case_id:caseId}).then(function(){setToast("Кейс удалён");return refreshPublic();}).then(function(){return loadAdminTab("cases");}));
      }
      else if(action==="admin-set-balance")task(adminSetBalance(button.getAttribute("data-id")));
      else if(action==="admin-grant-skin")task(adminGrantSkin(button.getAttribute("data-id")));
      else if(action==="admin-import-skins")task(adminImportSkins());
      else if(action==="admin-ban"){
        var userId=button.getAttribute("data-id"),ban=button.getAttribute("data-banned")!=="true";
        task(rpc("admin_set_ban",{p_user_id:userId,p_is_banned:ban}).then(function(){setToast(ban?"Пользователь заблокирован":"Блокировка снята");return loadAdminTab("users");}));
      }
      else if(action==="admin-save-settings")task(adminSaveSettings());
      else if(action==="admin-save-promo")task(adminSavePromo());
      else if(action==="admin-delete-promo")task(rpc("admin_delete_promocode",{p_promo_id:button.getAttribute("data-id")}).then(function(){setToast("Промокод удалён");return loadAdminTab("promos");}));
    });
    document.addEventListener("submit",function(event){
      if(event.target.getAttribute("data-form")!=="auth")return;
      event.preventDefault();task(submitAuth(event.target));
    });
    document.addEventListener("change",function(event){
      var target=event.target;
      if(!target||!target.getAttribute)return;
      var action=target.getAttribute("data-action");
      if(action==="target"){state.targetId=target.value;render();}
      if(action==="stake"||action==="stake-range"){
        var enteredStake=Math.max(0,Number(target.value)||0);
        state.stake=state.upgradeMode==="balance"?Math.min(enteredStake,state.balance):enteredStake;
        var valid=targetCandidates();
        if(valid.length&&!valid.some(function(item){return item.id===state.targetId;}))state.targetId=valid[0].id;
        render();
      }
    });
    document.addEventListener("input",function(event){
      var target=event.target;
      if(!target||!target.getAttribute)return;
      var action=target.getAttribute("data-action");
      if(target.id==="admin-rtp"){
        var rtpLabel=document.getElementById("rtp-value");
        if(rtpLabel)rtpLabel.textContent=target.value+"%";
      }
      if(action==="stake"||action==="stake-range"){
        var enteredStake=Math.max(0,Number(target.value)||0);
        state.stake=state.upgradeMode==="balance"?Math.min(enteredStake,state.balance):enteredStake;
        var value=document.querySelector('[data-action="stake"]'),range=document.querySelector('[data-action="stake-range"]');
        var selected=document.querySelector(".selected-value b");
        if(value&&Number(value.value)!==state.stake)value.value=String(state.stake);
        if(range&&target!==range)range.value=String(Math.min(Math.max(1,state.stake),Math.max(1,state.balance)));
        if(selected)selected.textContent=money(state.stake);
        var chance=document.querySelector(".chance"),chanceLabel=document.querySelector(".chance>div>b"),hint=document.querySelector(".chance-hint");
        if(chance&&chanceLabel){
          var candidate=targetCandidates();
          if(candidate.length&&!candidate.some(function(item){return item.id===state.targetId;}))state.targetId=candidate[0].id;
          var current=currentTarget(),chanceValue=state.stake>0&&current.price>state.stake?Math.max(1,Math.min(75,Math.floor(state.stake/current.price*75))):0;
          chance.style.setProperty("--angle",(chanceValue*3.6)+"deg");chanceLabel.innerHTML=chanceValue+'<i>%</i>';
          if(hint)hint.textContent="Успех: "+chanceValue+"%　·　Сгорание: "+(chanceValue?100-chanceValue:0)+"%";
          var preview=document.querySelector(".target-preview");
          if(preview&&candidate.length){
            var safeItem=current;
            preview.className="target-preview "+safeItem.rarity;
            preview.innerHTML=itemArt(safeItem)+'<span>'+RARITY_LABEL[safeItem.rarity]+'</span><b>'+escapeHtml(safeItem.name)+'</b><small>'+escapeHtml(safeItem.hero)+'</small><strong>'+money(safeItem.price)+'</strong>';
            var select=document.querySelector('[data-action="target"]');
            if(select){select.innerHTML=candidate.map(function(item){return '<option value="'+item.id+'" '+(item.id===safeItem.id?"selected":"")+'>'+escapeHtml(item.name)+' — '+money(item.price)+'</option>';}).join("");}
            var quick=document.querySelector(".quick-targets");
            if(quick)quick.innerHTML=candidate.slice(0,4).map(function(item){return '<button data-action="target-button" data-id="'+item.id+'" class="'+(item.id===safeItem.id?"selected":"")+'">'+escapeHtml(item.icon)+'<small>'+money(item.price)+'</small></button>';}).join("");
          }
        }
      }
    });
    function initialize() {
      render();
      if(!db){setToast("Supabase JS не загрузился. Проверьте подключение к CDN.");return;}
      db.auth.onAuthStateChange(function(event,session){
        state.session=session;state.user=session?session.user:null;
        if(!state.user){
          state.role="user";state.isBanned=false;state.balance=0;state.inventory=[];
          if(state.page!=="cases"){state.page="cases";state.caseId=null;}
          render();
        }else{
          window.setTimeout(function(){
            refreshAccount().then(function(){render();}).catch(function(error){console.error(error);setToast(error.message||"Не удалось загрузить профиль");});
          },0);
        }
      });
      db.auth.getSession().then(function(result){
        if(result.error)throw result.error;
        state.session=result.data.session;state.user=state.session?state.session.user:null;
        return refreshPublic();
      }).then(function(){
        return state.user?refreshAccount():null;
      }).then(function(){initDrops();render();}).catch(function(error){
        console.error(error);initDrops();render();setToast("Ошибка подключения к Supabase: "+(error.message||"проверьте URL, ключ и SQL-скрипт"));
      });
    }
    initDrops();initialize();
    window.setTimeout(updateLive,Math.max(1,Number(state.settings.live_drop_speed)||5)*1000);
    window.setInterval(updateCountdown,1000);
  })();
  </script>
</body>
</html>
